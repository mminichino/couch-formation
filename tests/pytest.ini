[pytest]
addopts = -rE --no-header -v -p no:warnings
log_file = pytest.log
log_file_level = DEBUG
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
markers =
    driver: live AWS/GCP/Azure driver tests
    capella: Capella function tests
    integration: AWS/GCP/Azure main module integration tests
    regression: build/deploy/destroy node group regression tests
    cf_aws: AWS cloud tests
    cf_gcp: GCP cloud tests
    cf_azure: Azure cloud tests
    cf_capella: Capella tests
    cf_posix: Posix platform tests
    cf_windows: Windows platform tests
