[project]
name = "couchformation"
description = "Couchbase Cloud Automation"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
authors = [
    {name = "Michael Minichino", email = "info@unix.us.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["couchbase", "devops", "automation"]
dependencies = [
    "typer>=0.27.1",
    "pydantic>=2.13.4",
    "attrs>=26.1.0",
    "boto3>=1.43.82",
    "boto3-stubs>=1.43.81",
    "botocore>=1.43.82",
    "botocore[crt]",
    "cryptography>=50.0.1",
    "dnspython>=2.8.0",
    "protobuf>=6.33.6,<7.0.0",
    "google-api-core>=2.34.0",
    "google-cloud-core>=2.7.0",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-compute>=1.51.0",
    "google-cloud-storage>=3.13.1",
    "google-cloud-dns>=0.37.1",
    "google-cloud-network-management>=1.37.0",
    "google-cloud-resource-manager>=1.18.0",
    "Jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pycryptodome>=3.23.0",
    "pytz>=2026.1",
    "pyvmomi>=9.0.0.0",
    "requests>=2.32.0",
    "urllib3>=2.3.0",
    "azure-core>=1.41.0",
    "azure-mgmt-resource>=26.0.0",
    "azure-identity>=1.25.3",
    "azure-mgmt-network>=32.0.0",
    "azure-mgmt-compute>=38.3.0",
    "azure-mgmt-core>=1.6.0",
    "azure-mgmt-dns>=9.0.0",
    "azure-mgmt-privatedns>=2.0.0",
    "azure-mgmt-subscription>=3.1.1",
    "ply>=3.11",
    "sqlite-utils>=3.38",
    "paramiko>=5.0.0",
    "overrides>=7.7.0",
    "PyYAML!=6.0.0,!=5.4.0,!=5.4.1",
    "rsa>=4.9.1",
    "pywinrm>=0.5.0",
    "aiohttp>=3.13.0",
    "psutil>=7.0.0",
    "six>=1.17.0",
    "libcapella>=1.0.20",
    "tenacity>=9.1.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "PyJWT>=2.13.0",
    "httpx>=0.28.1",
]

[project.urls]
"Homepage" = "https://github.com/mminichino/couch-formation"
"Changelog" = "https://github.com/mminichino/couch-formation/blob/main/CHANGELOG.md"

[project.scripts]
cloudmgr = "couchformation.cli.cloudmgr:main"
dbdump = "couchformation.cli.dbdump:main"

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-rerunfailures>=16.1",
    "pytest-mock>=3.14.1",
    "couchbase-connect-py>=0.5.0",
]
dev = [
    "hatch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "couchformation/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "couchformation/**",
    "couchformation/data/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["couchformation"]

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py313", "py312"]
no_package = true

[tool.tox.env_run_base]
skip_install = true
allowlist_externals = ["uv"]

[tool.tox.env.py312]
description = "Posix 3.12 full test"
env_python = "python3.12"
commands_pre = [["uv", "sync"]]
commands = [["uv", "run", "pytest", "-m", "driver"]]

[tool.tox.env.py313]
description = "Posix 3.13 full test"
env_python = "python3.13"
commands_pre = [["uv", "sync"]]
commands = [["uv", "run", "pytest", "-m", "driver"]]
